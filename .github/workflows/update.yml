# 매일 아침 데이터를 받아 적정가를 다시 계산하고 GitHub Pages(앱)에 올린다.
#  - 평일 22:37 UTC = 한국 화~토 07:37 (미국 장 마감 뒤, 한국 장 시작 전). GitHub 사정으로 늦어질 수 있음
#  - Actions 탭 → "데이터 갱신" → Run workflow 로 바로 실행 (full 체크 시 재무를 전 종목 다시 받음)
#  - 저장소 주인이 제목 "add: 티커" 로 이슈를 열면 감시 종목에 추가하고 바로 계산
#  - 계산에 쓰는 누적 데이터(state/)는 state 브랜치에 최신 1개만 보관
name: 데이터 갱신

on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "재무를 전 종목 다시 받기 (20~40분)"
        type: boolean
        default: false
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: ["app/**", "config/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'add:'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 패키지 설치
        run: pip install -r pipeline/requirements.txt

      - name: 이전 상태 가져오기 (state 브랜치)
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
            echo "이전 상태: $(ls state | tr '\n' ' ')"
          else
            echo "state 브랜치 없음 — 첫 실행"
          fi

      - name: 추가 요청 반영
        id: add
        if: github.event_name == 'issues'
        env:
          TITLE: ${{ github.event.issue.title }}
          NUM: ${{ github.event.issue.number }}
        run: |
          python pipeline/add_watch.py "$TITLE"
          if ! git diff --quiet config/watchlist.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/watchlist.txt
            git commit -qm "감시 종목 추가 (#$NUM)"
            git push -q
          fi

      - name: 데이터 받기 (yfinance)
        if: github.event_name != 'push'
        env:
          FULL: ${{ inputs.full && '--full' || '' }}
        run: python pipeline/run.py $FULL

      - name: 적정가 계산
        run: node pipeline/build.js

      - name: 상태 저장 (state 브랜치, 최신 1개만)
        if: github.event_name != 'push'
        run: |
          cd state
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "state $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state:state

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 추가 요청 이슈 닫기
        if: github.event_name == 'issues'
        env:
          NUM: ${{ github.event.issue.number }}
          ADDED: ${{ steps.add.outputs.added }}
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          if [ -n "$ADDED" ]; then MSG="추가하고 계산했습니다: $ADDED — $URL"; else MSG="새로 추가할 종목이 없었습니다(이미 있거나 형식이 맞지 않음). 예: add: LMT 또는 add: 247540:KQ"; fi
          gh issue close "$NUM" --comment "$MSG"
